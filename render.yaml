services:
  - type: web
    name: sih11-demo-backend
    env: docker
    region: singapore # Adjust if needed
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Note: Render automatically provides DATABASE_URL if you attach a Postgres DB to this service.
      # Without it, the backend will safely fallback to the local JSON file database.
